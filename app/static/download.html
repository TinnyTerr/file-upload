<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download — Oxymoron</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self'; worker-src 'self' blob:; connect-src 'self'; object-src 'none';">
  <style>
    .dl-type-icon { font-size: 52px; margin-bottom: 14px; opacity: 0.45; line-height: 1; }
    .copy-row + .copy-row { margin-top: 6px; }
    .curl-block {
      display: block;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      word-break: break-all;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-logo">Oxymoron<span class="logo-sub">(for files)</span></a>
    <div class="nav-spacer"></div>
  </nav>

  <div class="container" style="max-width:720px">

    <!-- Loading -->
    <div id="loading" class="empty">
      <div class="empty-icon">⟳</div>
      Loading…
    </div>

    <!-- Error -->
    <div id="error-state" class="hidden">
      <div class="download-hero">
        <div class="dl-type-icon">🔗</div>
        <div class="download-filename" style="opacity:0.45">Link not found</div>
        <div class="download-meta">
          <span>This link may have expired, been used up, or deactivated.</span>
        </div>
      </div>
    </div>

    <!-- File info -->
    <div id="file-state" class="hidden">
      <div class="download-hero">
        <div class="dl-type-icon" id="dl-type-icon"></div>
        <div class="download-filename" id="dl-filename"></div>
        <div class="download-meta">
          <span id="dl-size"></span>
          <span id="dl-type"></span>
          <span id="dl-uses" class="hidden"></span>
        </div>
        <div class="download-btn-wrap">
          <a id="dl-button" href="#" class="btn btn-primary" style="font-size:15px;height:auto;padding:13px 36px;font-weight:600">
            ↓ Download
          </a>
        </div>
      </div>

      <!-- Preview injected here by JS -->
      <div id="preview-section"></div>

      <!-- Share / copy card -->
      <div class="card">
        <div class="section-label">Share &amp; copy</div>
        <div class="mb-12 hidden" id="save-wrap">
          <button class="btn btn-ghost btn-sm" id="save-file">Save to my files</button>
          <button class="btn btn-ghost btn-sm" id="open-link">Open</button>
        </div>
        <div class="copy-row">
          <span class="copy-row-text" id="share-url"></span>
          <button class="btn btn-ghost btn-sm" id="copy-share">Copy link</button>
          <button class="btn btn-ghost btn-sm" id="copy-share-md">MD</button>
          <button class="btn btn-ghost btn-sm" id="copy-share-html">HTML</button>
        </div>
        <div class="copy-row">
          <span class="copy-row-text" id="raw-url"></span>
          <button class="btn btn-ghost btn-sm" id="copy-raw">Copy direct</button>
        </div>
        <div class="mt-12" id="hash-wrap" style="display:none">
          <div class="text-xs text-muted mb-4">hashes</div>
          <select id="hash-select"></select>
          <code class="curl-block text-mono" id="hash-value"></code>
        </div>
        <div class="mt-12">
          <div class="text-xs text-muted mb-4">curl download</div>
          <code class="curl-block text-mono" id="curl-cmd"></code>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="/static/js/download.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Oxymoron</title>
  <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
  <div class="container-sm">
    <div class="login-header" data-reveal>
      <div class="login-logo">Oxymoron<span class="logo-sub">(for files)</span></div>
      <div class="login-title">Sign in</div>
      <div class="login-sub">Encrypted, expiring file dispatch</div>
    </div>

    <div class="card" data-reveal>
      <div id="alert" class="alert alert-error hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" autocapitalize="off" spellcheck="false" autofocus>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password">
        </div>
        <div class="mt-24">
          <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Sign in</button>
        </div>
      </form>
    </div>

    <div class="auth-foot" data-reveal>
      Sessions are short-lived. Links can expire,<br>cap their downloads, and self-destruct.
    </div>
  </div>
  <script type="module" src="/static/js/login.js"></script>
</body>
</html>

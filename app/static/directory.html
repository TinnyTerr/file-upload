<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Folder — Oxymoron</title>
  <link rel="stylesheet" href="/static/css/theme.css">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self'; worker-src 'self' blob:; connect-src 'self'; object-src 'none';">
  <style>
    /* Directory-specific bits — the bundle manifest */
    .dir-hero { padding: 40px 0 28px; }
    .dir-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .dir-eyebrow::before {
      content: ''; width: 7px; height: 7px; border-radius: 2px;
      background: var(--accent); transform: rotate(45deg);
      box-shadow: 0 0 10px rgba(240,179,94,0.5);
    }
    .dir-title {
      font-family: var(--font-display);
      font-size: 30px; font-weight: 600; letter-spacing: -0.02em;
      word-break: break-word; margin-bottom: 12px;
    }
    .dir-meta {
      font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);
      display: flex; gap: 0; flex-wrap: wrap; margin-bottom: 24px; letter-spacing: 0.02em;
    }
    .dir-meta span { padding: 0 14px; border-left: 1px solid var(--border-strong); }
    .dir-meta span:first-child { padding-left: 0; border-left: none; }

    .dir-manifest { display: flex; flex-direction: column; gap: 0; }
    .dir-row {
      display: flex; align-items: center; gap: 13px;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-top: none;
      background: var(--surface);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .dir-row:first-child { border-top: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; }
    .dir-row:last-child  { border-radius: 0 0 var(--radius) var(--radius); }
    .dir-row:hover { background: var(--surface-2); }
    .dir-row-idx {
      font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
      width: 26px; flex-shrink: 0; text-align: right;
    }
    .dir-row-icon { font-size: 18px; flex-shrink: 0; opacity: 0.7; }
    .dir-row-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dir-row-size { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);
      white-space: nowrap; flex-shrink: 0; }
    .dl-progress-note { font-size: 12px; color: var(--accent); font-family: var(--font-mono); margin-top: 10px; }
    .dir-toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0 0; }
    .dir-section { margin-bottom:18px; }
    .dir-section-title {
      font-family:var(--font-mono); font-size:11px; letter-spacing:.12em;
      text-transform:uppercase; color:var(--text-muted); margin:0 0 8px;
    }
    .dir-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
    .dir-tile {
      border:1px solid var(--border); background:var(--surface); border-radius:var(--radius);
      padding:10px; min-height:120px; display:flex; flex-direction:column; gap:8px;
    }
    .dir-tile-preview {
      height:82px; border:1px solid var(--border); border-radius:var(--radius-sm);
      background:var(--surface-2); overflow:hidden; display:flex; align-items:center; justify-content:center;
      color:var(--text-muted); font-family:var(--font-mono); font-size:11px;
    }
    .dir-tile-preview img, .dir-tile-preview video { width:100%; height:100%; object-fit:cover; display:block; }
    .dir-tile-name { font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dir-tile-actions { display:flex; gap:6px; margin-top:auto; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-logo">Oxymoron<span class="logo-sub">(for files)</span></a>
    <div class="nav-spacer"></div>
  </nav>

  <div class="container" style="max-width:760px">

    <div id="loading" class="empty">
      <div class="empty-icon">⟳</div>
      Opening folder…
    </div>

    <div id="error-state" class="hidden">
      <div class="download-hero">
        <div class="dl-type-icon">📁</div>
        <div class="download-filename" style="opacity:0.45">Folder not found</div>
        <div class="download-meta">
          <span>This folder may have expired or been removed.</span>
        </div>
      </div>
    </div>

    <div id="dir-state" class="hidden">
      <div class="dir-hero" data-reveal>
        <div class="dir-eyebrow">Shared folder</div>
        <div class="dir-title" id="dir-title"></div>
        <div class="dir-meta">
          <span id="dir-count"></span>
          <span id="dir-size"></span>
          <span id="dir-enc"></span>
        </div>
        <div class="download-btn-wrap" style="justify-content:flex-start">
          <button id="dl-all" class="btn btn-primary" style="height:auto;padding:12px 26px;font-size:14px">
            ↓ Download all (.zip)
          </button>
        </div>
        <div class="dir-toolbar">
          <button id="toggle-previews" class="btn btn-ghost btn-sm">Disable previews</button>
          <button id="save-folder" class="btn btn-ghost btn-sm hidden">Save to my files</button>
        </div>
        <div id="dl-note" class="dl-progress-note hidden"></div>
      </div>

      <div id="enc-banner"></div>

      <div class="section-label" data-reveal>Contents</div>
      <div class="dir-manifest" id="dir-manifest" data-reveal></div>
    </div>

  </div>

  <script type="module" src="/static/js/directory.js"></script>
</body>
</html>

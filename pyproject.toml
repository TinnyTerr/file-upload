[project]
name = "fileupload"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "cryptography>=43",
    "zstandard>=0.22",
    "apscheduler>=3.10",
    "rjsmin>=1.2",
    "rcssmin>=1.1",
    "pillow>=10",
]

[project.optional-dependencies]
# httpx2 (separate module from httpx) silences Starlette's TestClient deprecation warning; both coexist
dev = ["pytest>=8.0", "httpx>=0.27", "httpx2>=2.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

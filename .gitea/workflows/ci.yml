name: CI

on:
  push:
  pull_request:

jobs:
  server-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: server
        run: bun install --frozen-lockfile
      - working-directory: server
        run: bun run typecheck

  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: server
        run: bun install --frozen-lockfile
      - working-directory: server
        run: bun test


  server-biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: server
        run: bun install --frozen-lockfile
      - working-directory: server
        run: bunx @biomejs/biome check .

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: client
        run: bun install --frozen-lockfile
      - working-directory: client
        run: bun run typecheck
      - name: Build (throwaway output)
        working-directory: client
        run: |
          OUT=$(mktemp -d)
          bunx vite build --outDir "$OUT"
          rm -rf "$OUT"

  client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: client
        run: bun install --frozen-lockfile
      - working-directory: client
        run: bun test
      - working-directory: client
        run: bun run test:crypto

  client-biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: client
        run: bun install --frozen-lockfile
      - working-directory: client
        run: bunx @biomejs/biome check .

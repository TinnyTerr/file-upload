name: Release

# Runs after CI is green on main: picks the next semver from commit titles
# (scripts/release.ts), bumps package.json, tags vX.Y.Z and publishes a release.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Skip if main moved on or HEAD is already a release
        id: guard
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ] || \
             git log -1 --format=%s | grep -q '^release v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute and bump
        if: steps.guard.outputs.skip != 'true'
        id: ver
        run: |
          set +e
          out=$(bun scripts/release.ts --write); code=$?
          if [ $code -eq 2 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ $code -eq 0 ] || exit $code
          echo "version=$(echo "$out" | sed -n 's/^VERSION=//p')" >> "$GITHUB_OUTPUT"
          echo "$out" | sed '1,/^---$/d' > notes.md
      - name: Commit, tag, release
        if: steps.guard.outputs.skip != 'true' && steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release v$V"
          git tag "v$V"
          git push origin HEAD:main "v$V"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh release create "v$V" --title "v$V" --notes-file notes.md
      # Built after the release commit so the Sentry release name
      # (fileupload@X.Y.Z+<sha>) is the one a deploy of this tag reports. The
      # Vite plugin uploads maps, creates the release and links commits when
      # the three SENTRY_* build vars are set; the tarball is the exact bundle
      # those maps belong to, so deploy that rather than rebuilding.
      - name: Build client (uploads source maps)
        if: steps.guard.outputs.skip != 'true' && steps.ver.outputs.skip != 'true'
        env:
          BUILD_SHA: ${{ env.SHA }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_WEB: ${{ vars.SENTRY_PROJECT_WEB }}
          SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
        run: |
          bun install --frozen-lockfile
          bun --cwd=client run build
      - name: Attach built client
        if: steps.guard.outputs.skip != 'true' && steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          tar -czf public.tar.gz -C public .
          gh release upload "v$V" public.tar.gz
